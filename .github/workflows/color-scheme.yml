name: Color Scheme

# Guarantees the derived light scheme never drifts from theme.json. The
# generator uses only Node built-ins, so no dependency install is required.

on:
  push:
    branches:
      - main
    paths:
      - 'theme.json'
      - 'tools/color-scheme/**'
      - 'styles/light.json'
      - '.github/workflows/color-scheme.yml'
  pull_request:
    paths:
      - 'theme.json'
      - 'tools/color-scheme/**'
      - 'styles/light.json'
      - '.github/workflows/color-scheme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify generated output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run derivation tests
        run: node --test tools/color-scheme/*.test.mjs

      - name: Fail if committed output is stale
        run: node tools/color-scheme/build.mjs --check
